name: BrightBean staging security smoke

on:
  schedule:
    # 11:00 IST daily. Schedule runs only on the default branch after merge.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brightbean-staging-security-smoke
  cancel-in-progress: true

jobs:
  verify-public-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run no-network contract tests
        run: python3 tools/ai_ops/test_staging_smoke.py
      - name: Verify public HTTPS health and deny unauthenticated API access
        run: python3 tools/ai_ops/check_mcp_auth_public.py
